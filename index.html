          '<dl class="facts">' +
            s.facts.map(function (_, i) {
              return '<div class="fact">' + f('dt', 'facts.' + i + '.label', '', 'Popisek') + f('dd', 'facts.' + i + '.value', '', 'Hodnota') + del('del-fact:' + i, 'Smazat řádek') + '</div>';
            }).join('') +
          '</dl>' +
          '<div class="row-actions">' + add('add-fact', 'Přidat řádek') + '</div>' +
        '</div>' +
      '</div></section>';

    // Zkušenosti
    html +=
      '<section class="section section-tinted" id="zkusenosti"><div class="wrapper">' +
        '<p class="section-label">Praxe</p><h2 class="section-title">Zkušenosti</h2>' +
        '<ol class="timeline">' +
          s.experience.map(function (job, i) {
            var p = 'experience.' + i;
            return '<li class="timeline-item"><span class="timeline-dot" aria-hidden="true"></span><article class="card">' +
              del('del-exp:' + i, 'Smazat celou pozici') +
              '<header class="card-head">' + f('h3', p + '.role', '', 'Pozice') + f('span', p + '.dates', 'pill', 'Od – do') + '</header>' +
              f('p', p + '.company', 'card-company', 'Firma · Město') +
              '<ul class="card-list">' +
                job.points.map(function (_, j) {
                  return '<li>' + f('span', p + '.points.' + j, '', 'Co jsem dělal') + del('del-point:' + i + ':' + j, 'Smazat bod') + '</li>';
                }).join('') +
              '</ul>' +
              '<div class="row-actions">' + add('add-point:' + i, 'Přidat bod') + '</div>' +
            '</article></li>';
          }).join('') +
        '</ol>' +
        '<div class="row-actions">' + add('add-exp', 'Přidat pozici') + '</div>' +
      '</div></section>';

    // Dovednosti
    html +=
      '<section class="section" id="dovednosti"><div class="wrapper">' +
        '<p class="section-label">Co umím</p><h2 class="section-title">Dovednosti</h2>' +
        f('p', 'skillsLede', 'section-lede', 'Úvodní věta') +
        '<div class="skills-grid">' +
          s.skills.map(function (_, i) {
            var p = 'skills.' + i;
            return '<div class="skill-card">' + del('del-skill:' + i, 'Smazat dovednost') +
              f('h3', p + '.title', '', 'Název') + f('p', p + '.text', '', 'Popis') + '</div>';
          }).join('') +
        '</div>' +
        '<div class="row-actions">' + add('add-skill', 'Přidat dovednost') + '</div>' +
        '<ul class="tag-cloud" aria-label="Další dovednosti">' +
          s.tags.map(function (_, i) { return '<li>' + f('span', 'tags.' + i, '', 'Tag') + del('del-tag:' + i, 'Smazat tag') + '</li>'; }).join('') +
          '<li class="edit-only" style="padding:0;border:none;background:none">' + add('add-tag', 'Přidat tag') + '</li>' +
        '</ul>' +
      '</div></section>';

    // Kontakt
    html +=
      '<section class="contact" id="kontakt"><div class="wrapper"><div class="contact-inner">' +
        '<p class="section-label">Kontakt</p>' +
        f('h2', 'contactTitle', 'section-title', 'Nadpis') +
        f('p', 'contactLede', 'section-lede', 'Text výzvy') +
        '<div class="contact-actions">' +
          '<a class="btn btn-light" href="mailto:' + esc(s.email) + '">Poslat e-mail</a>' +
          '<a class="btn btn-ghost-light" href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">' + LINKEDIN_SVG + 'Napsat na LinkedInu</a>' +
        '</div>' +
        '<p class="email-line">' + f('span', 'email', 'email', 'tvuj@email.cz') + ' <button type="button" class="copy-btn" data-action="copy-email">Kopírovat</button></p>' +
      '</div></div></section>';

    html += '</main>';

    html +=
      '<footer class="site-footer"><div class="wrapper footer-inner">' +
        '<p>© ' + new Date().getFullYear() + ' ' + esc(s.name) + '</p>' +
        '<a href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' +
      '</div></footer>';

    if (artifactApi) {
      html += '<div class="editbar" aria-live="polite">' +
        '<div class="edit-status" id="edit-status"></div>' +
        (editing
          ? '<button type="button" class="btn-cancel" data-action="cancel"' + (busy ? ' disabled' : '') + '>Zrušit</button>' +
            '<button type="button" class="btn-save" data-action="save"' + (busy || !isDirty() ? ' disabled' : '') + '>' + (busy ? 'Ukládám…' : 'Uložit') + '</button>'
          : '<button type="button" class="btn-edit" data-action="edit">Upravit stránku</button>') +
      '</div>';
    }

    app.innerHTML = html;
    onScroll();
    if (focusPath) {
      var el = app.querySelector('[data-path="' + focusPath + '"]');
      if (el) placeCaretAtEnd(el);
    }
  }

  function placeCaretAtEnd(el) {
    el.focus();
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      r.collapse(false);
      var sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) {}
  }

  var statusTimer;
  function setStatus(msg, sticky) {
    var el = document.getElementById('edit-status');
    if (!el) return;
    el.innerHTML = msg ? '<span>' + esc(msg) + '</span>' : '';
    clearTimeout(statusTimer);
    if (msg && !sticky) statusTimer = setTimeout(function () { setStatus(''); }, 5000);
  }
  function refreshSaveButton() {
    var b = app.querySelector('.btn-save');
    if (b) b.disabled = busy || !isDirty();
  }

  /* ---------- Uložení: stránka se znovu vygeneruje ze stavu ---------- */
  var FALLBACK_RESET = ':root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  function buildDocument() {
    var resetEl = document.querySelector('head > style');
    var reset = resetEl ? resetEl.textContent : FALLBACK_RESET;
    var icon = document.querySelector('link[rel="icon"]');
    var headMeta = [
      '<title>Pavel Škuthan</title>',
      '<meta name="claude:viewport-fit-sides" content="cover">',
      '<meta name="description" content="Osobní web Pavla Škuthana – zkušenosti, dovednosti a kontakt.">',
      icon ? '<link rel="icon" type="image/svg+xml" href="' + esc(icon.getAttribute('href')) + '">' : '',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap">'
    ].filter(Boolean).join('\n');
    var json = JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
    var css = document.getElementById('page-css').textContent;
    var themeJs = document.getElementById('theme-init').textContent;
    var pageJs = document.getElementById('page-js').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      headMeta + '\n' +
      '<style id="page-css">' + css + '</style>\n' +
      '<script id="theme-init">' + themeJs + '<\/script>\n' +
      '<script type="application/json" id="page-data">\n' + json + '\n<\/script>\n' +
      '<div id="app"></div>\n' +
      '<script id="page-js">' + pageJs + '<\/script>\n' +
      '</body></html>';
  }

  function save() {
    if (!artifactApi || busy || !isDirty()) return;
    busy = true;
    // Kdyby uložení selhalo kvůli konfliktu, rozepsané změny přežijí znovunačtení.
    try { sessionStorage.setItem('pavel-draft', JSON.stringify(state)); } catch (e) {}
    render();
    setStatus('Ukládám…', true);
    artifactApi.publish(buildDocument()).then(function () {
      try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
      busy = false;
      saved = clone(state);
      setStatus('Uloženo. Stránka se načte v nové verzi.', true);
    }, function (err) {
      busy = false;
      var code = err && err.code;
      render();
      if (code === 'conflict') {
        setStatus('Mezitím vznikla novější verze. Stránka se načte znovu a tvoje změny obnovím.', true);
        return;
      }
      try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' || code === 'capability_disabled') {
        artifactApi = null;
        editing = false;
        render();
        return;
      }
      var msg = {
        rate_limited: 'Ukládáš moc často. Zkus to za chvilku znovu.',
        too_large: 'Stránka je na uložení moc velká.',
        invalid_content: 'Stránku se nepodařilo uložit, obsah je neplatný.'
      }[code] || 'Uložení se nepovedlo. Zkus to prosím znovu.';
      setStatus(msg, true);
    });
  }

  /* ---------- Akce (tlačítka) ---------- */
  function blankJob() { return { role: '[Pozice]', dates: '[Od – do]', company: '[Firma] · [Město]', points: ['[Co jsem tam dělal]'] }; }

  function handleAction(action, btn) {
    var parts = action.split(':');
    var name = parts[0];
    var a = parseInt(parts[1], 10);
    var b = parseInt(parts[2], 10);
    switch (name) {
      case 'theme': {
        var current = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var next = current === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('pavel-theme', next); } catch (e) {}
        return;
      }
      case 'copy-email': {
        var done = function () { btn.textContent = 'Zkopírováno'; setTimeout(function () { btn.textContent = 'Kopírovat'; }, 1800); };
        try {
          navigator.clipboard.writeText(state.email).then(done, function () { selectEmail(); });
        } catch (e) { selectEmail(); }
        return;
      }
      case 'edit': editing = true; render(); setStatus(''); return;
      case 'cancel': state = clone(saved); editing = false; render(); return;
      case 'save': save(); return;
      case 'upload-photo': document.getElementById('photo-input').click(); return;
      case 'remove-photo': state.photo = ''; break;
      case 'add-para': state.about.push(''); break;
      case 'del-para': state.about.splice(a, 1); break;
      case 'add-fact': state.facts.push({ label: '[Popisek]', value: '[Hodnota]' }); break;
      case 'del-fact': state.facts.splice(a, 1); break;
      case 'add-exp': state.experience.unshift(blankJob()); break;
      case 'del-exp': state.experience.splice(a, 1); break;
      case 'add-point': state.experience[a].points.push(''); break;
      case 'del-point': state.experience[a].points.splice(b, 1); break;
      case 'add-skill': state.skills.push({ title: '[Nová dovednost]', text: '[Jedna věta, co s ní umím.]' }); break;
      case 'del-skill': state.skills.splice(a, 1); break;
      case 'add-tag': state.tags.push(''); break;
      case 'del-tag': state.tags.splice(a, 1); break;
      default: return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    refreshSaveButton();
    if (/^add-(para|point|tag)/.test(name)) {
      var fields = app.querySelectorAll(name === 'add-para' ? '[data-path^="about."]' : name === 'add-tag' ? '[data-path^="tags."]' : '[data-path^="experience.' + a + '.points."]');
      if (fields.length) placeCaretAtEnd(fields[fields.length - 1]);
    }
  }

  function selectEmail() {
    var el = app.querySelector('.email');
    if (!el) return;
    var r = document.createRange();
    r.selectNodeContents(el);
    var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.preventDefault();
    handleAction(btn.dataset.action, btn);
  });

  app.addEventListener('input', function (e) {
    var el = e.target.closest('[data-path]');
    if (!el || !editing) return;
    setPath(state, el.dataset.path, el.textContent.replace(/\s+/g, ' ').replace(/^\s/, ''));
    el.classList.toggle('is-ph', /^\[.*\]$/.test(el.textContent.trim()));
    refreshSaveButton();
  });

  app.addEventListener('keydown', function (e) {
    if (!editing) return;
    var el = e.target.closest('[data-path]');
    if (el && e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  app.addEventListener('paste', function (e) {
    var el = e.target.closest('[data-path]');
    if (!el || !editing) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g, ' ');
    if (!document.execCommand('insertText', false, text)) {
      el.textContent += text;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });

  // V režimu úprav nesmí odkazy kolem textu odvádět jinam.
  app.addEventListener('click', function (e) {
    if (editing && e.target.closest('a[href]') && !e.target.closest('[data-action]')) e.preventDefault();
  }, true);

  /* ---------- Nahrání fotky ---------- */
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.id = 'photo-input';
  fileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
  fileInput.hidden = true;
  document.body.appendChild(fileInput);
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file || !assetsApi) return;
    setStatus('Nahrávám fotku…', true);
    assetsApi.upload(file).then(function (res) {
      state.photo = res.id;
      render();
      setStatus('Fotka nahraná. Nezapomeň dát Uložit.');
    }, function (err) {
      var code = err && err.code;
      setStatus({
        too_large: 'Fotka je moc velká, maximum je 20 MB.',
        unsupported_type: 'Tenhle formát nejde nahrát. Použij JPG, PNG, WebP nebo GIF.',
        quota_or_state: 'Úložiště stránky je plné.',
        rate_limited: 'Moc rychle za sebou. Zkus to za chvilku.'
      }[code] || 'Fotku se nepodařilo nahrát. Zkus to znovu.', true);
    });
  });

  function onScroll() {
    var h = app.querySelector('.site-header');
    if (h) h.classList.toggle('scrolled', window.scrollY > 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  render();

  /* ---------- Zapnutí úprav, pokud to prohlížeč (claude.ai) dovolí ---------- */
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (api) {
      if (!api) return null;
      return window.claude.use('user').then(function (user) {
        if (!user || typeof user.canEdit !== 'function') return true;
        return Promise.resolve(user.canEdit()).catch(function () { return true; });
      }).then(function (canEdit) {
        if (canEdit === false) return null;
        artifactApi = api;
        return window.claude.use('assets');
      });
    }).then(function (assets) {
      if (assets) assetsApi = assets;
      if (!artifactApi) return;
      var draft = null;
      try { draft = JSON.parse(sessionStorage.getItem('pavel-draft') || 'null'); } catch (e) {}
      if (draft && JSON.stringify(draft) !== JSON.stringify(saved)) {
        state = draft;
        editing = true;
        render();
        setStatus('Obnovil jsem tvoje neuložené změny. Zkontroluj je a dej Uložit.', true);
      } else {
        try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
        render();
      }
    }).catch(function () {});
  }
})();
</script>
