<title>Pavel Škuthan</title>

<style id="page-css">
/* Rozvržení: úvod je pískový pás v barvě zdi z fotky, fotka do něj zprava plynule přechází.
   Pod ním klasický životopis: vlevo název sekce, vpravo obsah. */
:root {
  --font: 'Schibsted Grotesk', 'Helvetica Neue', Arial, system-ui, sans-serif;

  --bg: hsl(40 30% 97%);
  --fg: hsl(200 25% 10%);
  --muted: hsl(200 6% 40%);
  --green: hsl(100 39% 27%);
  --line: hsl(40 12% 85%);
  --edit: hsl(38 95% 50%);
  --edit-bg: hsl(40 95% 90%);
  --danger: hsl(355 75% 46%);

  /* Úvodní pás má v obou režimech stejnou barvu jako zeď na fotce. */
  --sand: hsl(39 44% 86%);
  --sand-fg: hsl(200 25% 10%);
  --sand-muted: hsl(30 12% 32%);
  --sand-green: hsl(100 42% 24%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(200 18% 8%);
    --fg: hsl(40 20% 90%);
    --muted: hsl(200 6% 62%);
    --green: hsl(95 35% 62%);
    --line: hsl(200 10% 19%);
    --edit: hsl(40 95% 58%);
    --edit-bg: hsl(38 40% 17%);
    --danger: hsl(355 85% 66%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(200 18% 8%);
  --fg: hsl(40 20% 90%);
  --muted: hsl(200 6% 62%);
  --green: hsl(95 35% 62%);
  --line: hsl(200 10% 19%);
  --edit: hsl(40 95% 58%);
  --edit-bg: hsl(38 40% 17%);
  --danger: hsl(355 85% 66%);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.65;
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
img { display: block; max-width: 100%; }
button { font: inherit; }
::selection { background: var(--green); color: var(--bg); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

.wrapper {
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 640px) {
  .wrapper {
    padding-left: max(40px, env(safe-area-inset-left, 0px));
    padding-right: max(40px, env(safe-area-inset-right, 0px));
  }
}

.link {
  color: inherit;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
  text-decoration-color: var(--green);
  transition: color 150ms;
}
.link:hover { color: var(--green); }

/* ---------- Úvod ---------- */
.hero {
  position: relative;
  background: var(--sand);
  color: var(--sand-fg);
  overflow: hidden;
  isolation: isolate;
}
.topbar { display: flex; align-items: baseline; gap: 16px 40px; padding-block: 24px; position: relative; z-index: 2; }
.topbar-name { font-weight: 700; color: inherit; text-decoration: none; letter-spacing: -0.01em; }
.topbar nav { display: none; gap: 28px; font-size: 0.95rem; }
.topbar nav a { color: inherit; text-decoration: none; opacity: 0.75; }
.topbar nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
@media (min-width: 760px) { .topbar nav { display: flex; } }

.hero-photo {
  position: relative;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  height: min(108vw, 460px);
}
.hero-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 40% 0%;
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
}
.hero-body { position: relative; z-index: 2; padding-block: 0 64px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; max-width: 560px; }
.hero-kicker { font-weight: 600; color: var(--sand-green); font-size: 1rem; }
.hero-name {
  font-size: clamp(3.4rem, 13vw, 7.6rem);
  font-weight: 800;
  line-height: 0.88;
  letter-spacing: -0.05em;
  margin-top: -4px;
}
.hero-name span { display: block; }
.hero-name .last { color: var(--sand-green); }
.hero-lede { font-size: clamp(1.1rem, 2vw, 1.3rem); line-height: 1.5; color: var(--sand-muted); max-width: 30em; }
.hero-links { display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 1.05rem; }
.hero .link { text-decoration-color: var(--sand-green); }
.hero .link:hover { color: var(--sand-green); }

@media (min-width: 640px) {
  .hero-photo {
    margin-left: calc(-1 * max(40px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(40px, env(safe-area-inset-right, 0px)));
  }
}
@media (min-width: 900px) {
  .hero-inner { min-height: 620px; display: flex; flex-direction: column; }
  .hero-photo {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    height: auto;
    width: min(54vw, 640px);
    margin: 0;
    z-index: 0;
  }
  .hero-photo img {
    object-position: 30% 8%;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 34%);
    mask-image: linear-gradient(to right, transparent 0%, #000 34%);
  }
  .hero-body { margin-block: auto; padding-block: 48px 96px; }
}

/* ---------- Sekce životopisu ---------- */
.cv { padding-block: 40px 24px; }
.row { display: grid; gap: 16px 48px; padding-block: 56px; border-top: 1px solid var(--line); }
.row:first-child { border-top: none; }
@media (min-width: 860px) { .row { grid-template-columns: 220px minmax(0, 1fr); } }
.row-label { font-size: 1.05rem; font-weight: 600; color: var(--muted); letter-spacing: -0.005em; }
.row-body { min-width: 0; max-width: 46rem; display: flex; flex-direction: column; gap: 1.1em; }

.about-lead { font-size: 1.3rem; line-height: 1.5; font-weight: 500; letter-spacing: -0.01em; }
.para { display: flex; gap: 8px; align-items: flex-start; }
.fun { color: var(--muted); }
.fun strong { color: var(--fg); font-weight: 600; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px 32px; margin-top: 12px; }
@media (min-width: 560px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact { display: flex; flex-direction: column; position: relative; }
.fact dt { font-size: 0.88rem; color: var(--muted); }
.fact dd { font-weight: 600; }
body.editing .fact { flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: baseline; }

.jobs { list-style: none; padding: 0; display: grid; gap: 40px; }
.job { position: relative; display: grid; gap: 4px; }
.job-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 24px; }
.job-role { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; }
.job-dates { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.job-company { color: var(--muted); }
.job-points { list-style: none; padding: 0; margin-top: 8px; display: grid; gap: 4px; }
.job-points li { position: relative; padding-left: 20px; display: flex; gap: 8px; align-items: baseline; }
.job-points li::before { content: '–'; position: absolute; left: 0; color: var(--muted); }

.skills { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px 40px; }
@media (min-width: 640px) { .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.skill { position: relative; display: grid; gap: 2px; }
.skill h3 { font-size: 1.1rem; font-weight: 700; }
.skill p { color: var(--muted); }
.also { color: var(--muted); }
.also-label { color: var(--fg); font-weight: 600; margin-right: 6px; }
.tags { display: inline; list-style: none; padding: 0; }
.tags li { display: inline; }
.tags li:not(:last-of-type)::after { content: ', '; }
body.editing .tags li::after { content: none; }
body.editing .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
body.editing .tags li { display: inline-flex; gap: 6px; align-items: center; }

.contact-lede { color: var(--muted); }
.email-big {
  font-size: clamp(1.5rem, 4.5vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.contact-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; }
.text-btn {
  border: none; background: none; padding: 0;
  color: var(--muted);
  text-decoration: underline; text-underline-offset: 4px;
  cursor: pointer;
}
.text-btn:hover { color: var(--fg); }

.site-footer { padding-block: 0 48px; color: var(--muted); font-size: 0.92rem; }
.footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 24px; }

/* ---------- Režim úprav ---------- */
.editbar {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px;
  max-width: calc(100vw - 32px);
}
.editbar button {
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 9px 16px;
  font-weight: 600; font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 0 4px 16px hsl(200 30% 10% / 0.18);
}
.editbar button:disabled { opacity: 0.55; cursor: default; }
.btn-edit, .btn-save { background: var(--fg); color: var(--bg); }
.btn-cancel { background: var(--bg); color: var(--fg); border-color: var(--line) !important; }
.edit-status { flex-basis: 100%; text-align: right; font-size: 0.9rem; font-weight: 600; }
.edit-status:empty { display: none; }
.edit-status span { display: inline-block; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; }
.edit-banner { background: var(--edit-bg); color: var(--fg); border-bottom: 2px solid var(--edit); font-size: 0.95rem; }
.edit-banner .wrapper { padding-block: 12px; }

body.editing [data-path] {
  outline: 2px dashed color-mix(in srgb, var(--edit) 75%, transparent);
  outline-offset: 3px;
  border-radius: 3px;
  cursor: text;
  min-width: 2ch;
}
body.editing [data-path]:hover { outline-color: var(--edit); }
body.editing [data-path]:focus { outline: 3px solid var(--edit); background: color-mix(in srgb, var(--edit) 12%, transparent); }
body.editing [data-path]:empty::before { content: attr(data-ph); opacity: 0.6; font-style: italic; }
body.editing .is-ph { background: color-mix(in srgb, var(--edit) 24%, transparent); }
.edit-only { display: none !important; }
body.editing .edit-only { display: inline-flex !important; }
.add-btn {
  align-items: center; gap: 6px;
  border: 1px dashed var(--edit);
  background: transparent; color: inherit;
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 600; font-size: 0.9rem;
  cursor: pointer;
}
.add-btn:hover { background: color-mix(in srgb, var(--edit) 15%, transparent); }
.del-btn {
  flex: none;
  align-items: center; justify-content: center;
  width: 26px; height: 26px;
  border: none; border-radius: 50%;
  background: color-mix(in srgb, var(--danger) 14%, transparent);
  color: var(--danger);
  font-size: 1.05rem; line-height: 1; font-weight: 700;
  cursor: pointer;
}
.del-btn:hover { background: var(--danger); color: hsl(0 0% 100%); }
.job > .del-btn, .skill > .del-btn { position: absolute; top: 0; right: 0; }
body.editing .job, body.editing .skill { padding-right: 40px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.photo-actions { position: absolute; z-index: 3; right: 16px; bottom: 16px; gap: 8px; flex-wrap: wrap; }
.photo-actions .add-btn { background: var(--sand); color: var(--sand-fg); }
</style>

<div id="app"></div>
<script id="page-js">
(function () {
  'use strict';

  var app = document.getElementById('app');
  var saved = JSON.parse(document.getElementById('page-data').textContent);
  var state = clone(saved);
  var editing = false;
  var artifactApi = null;
  var assetsApi = null;
  var busy = false;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function getPath(obj, path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function setPath(obj, path, value) {
    var keys = path.split('.');
    var last = keys.pop();
    var target = keys.reduce(function (o, k) { return o[k]; }, obj);
    target[last] = value;
  }
  function isDirty() { return JSON.stringify(state) !== JSON.stringify(saved); }
  function photoSrc(p) {
    if (!p) return '';
    return /^(data:|https?:|\/)/.test(p) ? p : '/_blob/' + p;
  }

  /* Editovatelné pole: v režimu úprav dostane contenteditable. */
  function f(tag, path, cls, ph) {
    var val = getPath(state, path);
    var classes = (cls || '') + (/^\[.*\]$/.test(String(val).trim()) ? ' is-ph' : '');
    var attrs = ' data-path="' + path + '" data-ph="' + esc(ph || 'Napiš text…') + '"';
    if (editing) attrs += ' contenteditable="plaintext-only" spellcheck="true"';
    return '<' + tag + (classes.trim() ? ' class="' + classes.trim() + '"' : '') + attrs + '>' + esc(val) + '</' + tag + '>';
  }
  function del(action, label) {
    return '<button type="button" class="del-btn edit-only" data-action="' + action + '" aria-label="' + esc(label) + '" title="' + esc(label) + '">×</button>';
  }
  function add(action, label) {
    return '<button type="button" class="add-btn edit-only" data-action="' + action + '">+ ' + esc(label) + '</button>';
  }
  function row(id, label, body) {
    return '<section class="row" id="' + id + '"><h2 class="row-label">' + label + '</h2><div class="row-body">' + body + '</div></section>';
  }

  function render() {
    var s = state;
    var focusPath = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.path : null;
    document.body.classList.toggle('editing', editing);
    var src = photoSrc(s.photo);
    var nameParts = String(s.name).trim().split(/\s+/);
    var first = nameParts.shift() || '';
    var last = nameParts.join(' ');

    var html = '';
    if (editing) {
      html += '<div class="edit-banner" role="status"><div class="wrapper"><strong>Režim úprav.</strong> Klikni na text s čárkovaným rámečkem a přepiš ho. Žlutě jsou místa, která je ještě potřeba vyplnit. Nic se neuloží, dokud nedáš Uložit.</div></div>';
    }

    // Úvod
    html +=
      '<header class="hero" id="top">' +
        '<div class="wrapper hero-inner">' +
          '<div class="topbar"><a class="topbar-name" href="#top">' + esc(s.name) + '</a>' +
            '<nav aria-label="Hlavní navigace"><a href="#o-mne">O mně</a><a href="#zkusenosti">Zkušenosti</a><a href="#dovednosti">Dovednosti</a><a href="#kontakt">Kontakt</a></nav></div>' +
          (src ? '<div class="hero-photo"><img src="' + esc(src) + '" alt="' + esc(s.name) + '"></div>' : '') +
          '<div class="hero-body">' +
            ((editing || String(s.status).trim()) ? f('p', 'status', 'hero-kicker', 'Např. Momentálně hledám novou práci') : '') +
            (editing
              ? '<h1 class="hero-name">' + f('span', 'name', '', 'Jméno a příjmení') + '</h1>'
              : '<h1 class="hero-name"><span>' + esc(first) + '</span>' + (last ? '<span class="last">' + esc(last) + '</span>' : '') + '</h1>') +
            f('p', 'lede', 'hero-lede', 'Krátké představení') +
            '<p class="hero-links"><a class="link" href="#kontakt">Napište mi</a><a class="link" href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a></p>' +
          '</div>' +
        '</div>' +
        (assetsApi ? '<span class="edit-only photo-actions">' +
          '<button type="button" class="add-btn" data-action="upload-photo">' + (s.photo ? 'Změnit fotku' : 'Nahrát fotku') + '</button>' +
          (s.photo ? '<button type="button" class="add-btn" data-action="remove-photo">Odebrat fotku</button>' : '') +
          '</span>' : '') +
      '</header>';

    html += '<main id="main" class="wrapper cv">';

    // O mně
    html += row('o-mne', 'O mně',
      s.about.map(function (_, i) {
        return '<div class="para">' + f('p', 'about.' + i, i === 0 ? 'about-lead' : '', 'Odstavec textu') + (s.about.length > 1 ? del('del-para:' + i, 'Smazat odstavec') : '') + '</div>';
      }).join('') +
      '<div class="row-actions">' + add('add-para', 'Přidat odstavec') + '</div>' +
      '<p class="fun"><strong>Zajímavost: </strong>' + f('span', 'fun', '', 'Něco zajímavého o mně') + '</p>' +
      '<dl class="facts">' +
        s.facts.map(function (_, i) {
          return '<div class="fact">' + f('dt', 'facts.' + i + '.label', '', 'Popisek') + f('dd', 'facts.' + i + '.value', '', 'Hodnota') + del('del-fact:' + i, 'Smazat údaj') + '</div>';
        }).join('') +
      '</dl>' +
      '<div class="row-actions">' + add('add-fact', 'Přidat údaj') + '</div>'
    );

    // Zkušenosti
    html += row('zkusenosti', 'Zkušenosti',
      '<ol class="jobs">' +
        s.experience.map(function (job, i) {
          var p = 'experience.' + i;
          return '<li class="job">' + del('del-exp:' + i, 'Smazat celou pozici') +
            '<div class="job-head">' + f('h3', p + '.role', 'job-role', 'Pozice') + f('span', p + '.dates', 'job-dates', 'Od – do') + '</div>' +
            f('p', p + '.company', 'job-company', 'Firma, město') +
            '<ul class="job-points">' +
              job.points.map(function (_, j) {
                return '<li>' + f('span', p + '.points.' + j, '', 'Co jsem dělal') + del('del-point:' + i + ':' + j, 'Smazat bod') + '</li>';
              }).join('') +
            '</ul>' +
            '<div class="row-actions" style="margin-top:8px">' + add('add-point:' + i, 'Přidat bod') + '</div>' +
          '</li>';
        }).join('') +
      '</ol>' +
      '<div class="row-actions">' + add('add-exp', 'Přidat pozici') + '</div>'
    );

    // Dovednosti
    html += row('dovednosti', 'Dovednosti',
      '<div class="skills">' +
        s.skills.map(function (_, i) {
          var p = 'skills.' + i;
          return '<div class="skill">' + del('del-skill:' + i, 'Smazat dovednost') + f('h3', p + '.title', '', 'Název') + f('p', p + '.text', '', 'Popis') + '</div>';
        }).join('') +
      '</div>' +
      '<div class="row-actions">' + add('add-skill', 'Přidat dovednost') + '</div>' +
      '<div class="also"><span class="also-label">Dále:</span><ul class="tags" aria-label="Další dovednosti">' +
        s.tags.map(function (_, i) { return '<li>' + f('span', 'tags.' + i, '', 'Tag') + del('del-tag:' + i, 'Smazat') + '</li>'; }).join('') +
      '</ul></div>' +
      '<div class="row-actions">' + add('add-tag', 'Přidat další') + '</div>'
    );

    // Kontakt
    html += row('kontakt', 'Kontakt',
      f('p', 'contactLede', 'contact-lede', 'Výzva ke kontaktu') +
      '<p class="email-big">' + (editing ? f('span', 'email', 'email', 'tvuj@email.cz') : '<a class="link email" href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>') + '</p>' +
      '<p class="contact-links"><button type="button" class="text-btn" data-action="copy-email">Zkopírovat e-mail</button><a class="link" href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a></p>'
    );

    html += '</main>';

    html +=
      '<footer class="site-footer"><div class="wrapper"><div class="footer-inner">' +
        '<p>© ' + new Date().getFullYear() + ' ' + esc(s.name) + '</p>' +
        '<a class="link" style="font-weight:500" href="#top">Zpět nahoru</a>' +
      '</div></div></footer>';

    if (artifactApi) {
      html += '<div class="editbar" aria-live="polite">' +
        '<div class="edit-status" id="edit-status"></div>' +
        (editing
          ? '<button type="button" class="btn-cancel" data-action="cancel"' + (busy ? ' disabled' : '') + '>Zrušit</button>' +
            '<button type="button" class="btn-save" data-action="save"' + (busy || !isDirty() ? ' disabled' : '') + '>' + (busy ? 'Ukládám…' : 'Uložit') + '</button>'
          : '<button type="button" class="btn-edit" data-action="edit">Upravit stránku</button>') +
      '</div>';
    }

    app.innerHTML = html;
    if (focusPath) {
      var el = app.querySelector('[data-path="' + focusPath + '"]');
      if (el) placeCaretAtEnd(el);
    }
  }

  function placeCaretAtEnd(el) {
    el.focus();
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      r.collapse(false);
      var sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) {}
  }

  var statusTimer;
  function setStatus(msg, sticky) {
    var el = document.getElementById('edit-status');
    if (!el) return;
    el.innerHTML = msg ? '<span>' + esc(msg) + '</span>' : '';
    clearTimeout(statusTimer);
    if (msg && !sticky) statusTimer = setTimeout(function () { setStatus(''); }, 5000);
  }
  function refreshSaveButton() {
    var b = app.querySelector('.btn-save');
    if (b) b.disabled = busy || !isDirty();
  }

  /* ---------- Uložení: stránka se znovu vygeneruje ze stavu ---------- */
  var FALLBACK_RESET = ':root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  function buildDocument() {
    var resetEl = document.querySelector('head > style');
    var reset = resetEl ? resetEl.textContent : FALLBACK_RESET;
    var icon = document.querySelector('link[rel="icon"]');
    var headMeta = [
      '<title>Pavel Škuthan</title>',
      '<meta name="claude:viewport-fit-sides" content="cover">',
      '<meta name="description" content="Osobní web Pavla Škuthana – zkušenosti, dovednosti a kontakt.">',
      icon ? '<link rel="icon" type="image/svg+xml" href="' + esc(icon.getAttribute('href')) + '">' : '',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">'
    ].filter(Boolean).join('\n');
    var json = JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
    var css = document.getElementById('page-css').textContent;
    var pageJs = document.getElementById('page-js').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      headMeta + '\n' +
      '<style id="page-css">' + css + '</style>\n' +
      '<script type="application/json" id="page-data">\n' + json + '\n<\/script>\n' +
      '<div id="app"></div>\n' +
      '<script id="page-js">' + pageJs + '<\/script>\n' +
      '</body></html>';
  }

  function save() {
    if (!artifactApi || busy || !isDirty()) return;
    busy = true;
    // Kdyby uložení selhalo kvůli konfliktu, rozepsané změny přežijí znovunačtení.
    try { sessionStorage.setItem('pavel-draft', JSON.stringify(state)); } catch (e) {}
    render();
    setStatus('Ukládám…', true);
    artifactApi.publish(buildDocument()).then(function () {
      try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
      busy = false;
      saved = clone(state);
      setStatus('Uloženo. Stránka se načte v nové verzi.', true);
    }, function (err) {
      busy = false;
      var code = err && err.code;
      render();
      if (code === 'conflict') {
        setStatus('Mezitím vznikla novější verze. Stránka se načte znovu a tvoje změny obnovím.', true);
        return;
      }
      try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' || code === 'capability_disabled') {
        artifactApi = null;
        editing = false;
        render();
        return;
      }
      var msg = {
        rate_limited: 'Ukládáš moc často. Zkus to za chvilku znovu.',
        too_large: 'Stránka je na uložení moc velká.',
        invalid_content: 'Stránku se nepodařilo uložit, obsah je neplatný.'
      }[code] || 'Uložení se nepovedlo. Zkus to prosím znovu.';
      setStatus(msg, true);
    });
  }

  /* ---------- Akce (tlačítka) ---------- */
  function blankJob() { return { role: '[Pozice]', dates: '[Od – do]', company: '[Firma], [Město]', points: ['[Co jsem tam dělal]'] }; }

  function handleAction(action, btn) {
    var parts = action.split(':');
    var name = parts[0];
    var a = parseInt(parts[1], 10);
    var b = parseInt(parts[2], 10);
    switch (name) {
      case 'copy-email': {
        var label = btn.textContent;
        var done = function () { btn.textContent = 'Zkopírováno'; setTimeout(function () { btn.textContent = label; }, 1800); };
        try {
          navigator.clipboard.writeText(state.email).then(done, function () { selectEmail(); });
        } catch (e) { selectEmail(); }
        return;
      }
      case 'edit': editing = true; render(); setStatus(''); return;
      case 'cancel': state = clone(saved); editing = false; render(); return;
      case 'save': save(); return;
      case 'upload-photo': document.getElementById('photo-input').click(); return;
      case 'remove-photo': state.photo = ''; break;
      case 'add-para': state.about.push(''); break;
      case 'del-para': state.about.splice(a, 1); break;
      case 'add-fact': state.facts.push({ label: '[Popisek]', value: '[Hodnota]' }); break;
      case 'del-fact': state.facts.splice(a, 1); break;
      case 'add-exp': state.experience.unshift(blankJob()); break;
      case 'del-exp': state.experience.splice(a, 1); break;
      case 'add-point': state.experience[a].points.push(''); break;
      case 'del-point': state.experience[a].points.splice(b, 1); break;
      case 'add-skill': state.skills.push({ title: '[Nová dovednost]', text: '[Jedna věta, co s ní umím.]' }); break;
      case 'del-skill': state.skills.splice(a, 1); break;
      case 'add-tag': state.tags.push(''); break;
      case 'del-tag': state.tags.splice(a, 1); break;
      default: return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    refreshSaveButton();
    if (/^add-(para|point|tag)/.test(name)) {
      var fields = app.querySelectorAll(name === 'add-para' ? '[data-path^="about."]' : name === 'add-tag' ? '[data-path^="tags."]' : '[data-path^="experience.' + a + '.points."]');
      if (fields.length) placeCaretAtEnd(fields[fields.length - 1]);
    }
  }

  function selectEmail() {
    var el = app.querySelector('.email');
    if (!el) return;
    var r = document.createRange();
    r.selectNodeContents(el);
    var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.preventDefault();
    handleAction(btn.dataset.action, btn);
  });

  app.addEventListener('input', function (e) {
    var el = e.target.closest('[data-path]');
    if (!el || !editing) return;
    setPath(state, el.dataset.path, el.textContent.replace(/\s+/g, ' ').replace(/^\s/, ''));
    el.classList.toggle('is-ph', /^\[.*\]$/.test(el.textContent.trim()));
    refreshSaveButton();
  });

  app.addEventListener('keydown', function (e) {
    if (!editing) return;
    var el = e.target.closest('[data-path]');
    if (el && e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  app.addEventListener('paste', function (e) {
    var el = e.target.closest('[data-path]');
    if (!el || !editing) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g, ' ');
    if (!document.execCommand('insertText', false, text)) {
      el.textContent += text;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });

  // V režimu úprav nesmí odkazy kolem textu odvádět jinam.
  app.addEventListener('click', function (e) {
    if (editing && e.target.closest('a[href]') && !e.target.closest('[data-action]')) e.preventDefault();
  }, true);

  /* ---------- Nahrání fotky ---------- */
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.id = 'photo-input';
  fileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
  fileInput.hidden = true;
  document.body.appendChild(fileInput);
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file || !assetsApi) return;
    setStatus('Nahrávám fotku…', true);
    assetsApi.upload(file).then(function (res) {
      state.photo = res.id;
      render();
      setStatus('Fotka nahraná. Nezapomeň dát Uložit.');
    }, function (err) {
      var code = err && err.code;
      setStatus({
        too_large: 'Fotka je moc velká, maximum je 20 MB.',
        unsupported_type: 'Tenhle formát nejde nahrát. Použij JPG, PNG, WebP nebo GIF.',
        quota_or_state: 'Úložiště stránky je plné.',
        rate_limited: 'Moc rychle za sebou. Zkus to za chvilku.'
      }[code] || 'Fotku se nepodařilo nahrát. Zkus to znovu.', true);
    });
  });

  render();

  /* ---------- Zapnutí úprav, pokud to prohlížeč (claude.ai) dovolí ---------- */
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (api) {
      if (!api) return null;
      return window.claude.use('user').then(function (user) {
        if (!user || typeof user.canEdit !== 'function') return true;
        return Promise.resolve(user.canEdit()).catch(function () { return true; });
      }).then(function (canEdit) {
        if (canEdit === false) return null;
        artifactApi = api;
        return window.claude.use('assets');
      });
    }).then(function (assets) {
      if (assets) assetsApi = assets;
      if (!artifactApi) return;
      var draft = null;
      try { draft = JSON.parse(sessionStorage.getItem('pavel-draft') || 'null'); } catch (e) {}
      if (draft && JSON.stringify(draft) !== JSON.stringify(saved)) {
        state = draft;
        editing = true;
        render();
        setStatus('Obnovil jsem tvoje neuložené změny. Zkontroluj je a dej Uložit.', true);
      } else {
        try { sessionStorage.removeItem('pavel-draft'); } catch (e) {}
        render();
      }
    }).catch(function () {});
  }
})();
</script>
